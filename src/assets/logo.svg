<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer rounded rectangle -->
  <rect x="2" y="2" width="96" height="96" rx="24" ry="24" fill="url(#orangeGradient)" stroke="#fff" stroke-width="3"/>

  <!-- Inner rounded rectangle -->
  <rect x="8" y="8" width="84" height="84" rx="20" ry="20" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Left eye -->
  <circle cx="32" cy="35" r="3" fill="#fff"/>
  <path d="M 26 32 Q 32 25 38 32" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Right eye -->
  <circle cx="68" cy="35" r="3" fill="#fff"/>
  <path d="M 62 32 Q 68 25 74 32" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 28 58 Q 50 78 85 55" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Wink detail (small curve on right eye) -->
  <path d="M 75 50 Q 80 45 85 50" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>